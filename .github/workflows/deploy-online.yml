name: "Deploy Online"

# Online landing zone deployment from the public demo consumer repo.
# Consumes the reusable AKS Automatic module by pinned Git tag, then deploys
# the hardened demo app from manifests/online.
#
# One job, one human approval:
#   plan -> (apply) -> app deploy -> proof
#
# Why a self-hosted runner:
#   - A tenant-wide Modify policy forces publicNetworkAccess=Disabled on
#     every storage account, so Terraform state is reachable only through a
#     private endpoint in the runner VNet.
#   - The cluster's public API server only accepts the runner's static NAT
#     egress IP (TF_VAR_api_server_authorized_ip_ranges), so the app deploy
#     must run here too.
# The runner is an ephemeral, manually started Azure Container Apps Job
# (labels: self-hosted, aks-online-demo) with no managed identity. Azure
# access comes only from OIDC, gated by the `online` environment (required
# reviewer, protected branches only). The repo is public, so the plan is
# never uploaded as an artifact.
#
# Before dispatching, start one runner execution:
#   scripts/start-online-runner.ps1 -Repo martinopedal/aks-automatic-demo-env

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the plan, deploy the demo app, and prove it over HTTPS"
        required: true
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-online
  cancel-in-progress: false

env:
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_ONLINE }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID_ONLINE }}
  TF_VAR_api_server_authorized_ip_ranges: ${{ vars.AKS_AUTHORIZED_IP_RANGES_ONLINE }}

jobs:
  deploy:
    name: Plan, apply, deploy app, prove
    runs-on: [self-hosted, aks-online-demo]
    timeout-minutes: 60
    environment: online
    defaults:
      run:
        working-directory: deployments/online
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: "~1.9"
          terraform_wrapper: false

      - name: Install Azure CLI
        run: |
          if ! command -v az &> /dev/null; then
            curl -sL https://aka.ms/InstallAzureCLIDeb | bash
          fi
          az version

      - name: Azure Login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43  # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_ONLINE }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID_ONLINE }}

      - name: Ensure state container exists
        run: |
          az storage container create \
            --name "${{ vars.TFSTATE_CONTAINER_NAME_ONLINE }}" \
            --account-name "${{ vars.TFSTATE_STORAGE_ACCOUNT_ONLINE }}" \
            --auth-mode login -o none

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP_ONLINE }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT_ONLINE }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER_NAME_ONLINE }}" \
            -backend-config="key=aks-automatic-online.tfstate" \
            -backend-config="subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID_ONLINE }}" \
            -backend-config="tenant_id=${{ vars.AZURE_TENANT_ID }}" \
            -backend-config="client_id=${{ secrets.AZURE_CLIENT_ID_ONLINE }}" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform Plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -out=tfplan -detailed-exitcode
          ec=$?
          echo "exitcode=$ec" >> "$GITHUB_OUTPUT"
          [ "$ec" -eq 1 ] && exit 1 || exit 0

      - name: Plan summary
        if: steps.plan.outputs.exitcode == '2'
        run: |
          {
            echo "### Terraform plan"
            echo '```'
            terraform show -no-color tfplan | grep -E '^\s*# |^Plan:'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Terraform Apply
        if: inputs.apply && steps.plan.outputs.exitcode == '2'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Remove local plan file
        if: always()
        run: rm -f tfplan

      - name: Install kubectl and kubelogin
        if: inputs.apply
        run: |
          az aks install-cli --only-show-errors
          kubectl version --client
          kubelogin --version

      # The GitHub OIDC assertion is valid for 5 minutes; cluster creation
      # takes longer, so log in again before requesting the AKS API token.
      - name: Azure Login (OIDC, fresh token for AKS)
        if: inputs.apply
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43  # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_ONLINE }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID_ONLINE }}

      - name: Get AKS credentials (Entra ID, no local accounts)
        if: inputs.apply
        run: |
          az aks get-credentials \
            --resource-group rg-aks-online-demo \
            --name aks-online-demo \
            --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli
          # Namespace-scoped check: the pipeline identity has AKS RBAC
          # Writer and is intentionally not allowed to list cluster nodes.
          kubectl auth can-i create deployments -n online-demo
          kubectl get namespace online-demo --show-labels

      - name: Deploy the demo app
        if: inputs.apply
        working-directory: manifests/online
        run: |
          # The AKS Entra webhook (guard) has a 3s limit and occasionally times out; apply is idempotent.
          for attempt in 1 2 3; do
            kubectl apply -k . && break
            [ "$attempt" = "3" ] && { echo "::error::kubectl apply failed after 3 attempts"; exit 1; }
            echo "kubectl apply failed (attempt $attempt), retrying in 20s"
            sleep 20
          done
          kubectl rollout status deployment/online-demo -n online-demo --timeout=600s
          kubectl get deployment,pod,service,ingress,networkpolicy -n online-demo -o wide
          echo "Least privilege check (expect 'no'):"
          kubectl auth can-i list nodes || true

      - name: Prove the app is reachable over HTTPS only
        if: inputs.apply
        run: |
          # The dedicated controller's DNS label gives the stable hostname.
          LABEL=$(kubectl get nginxingresscontroller online-demo -o jsonpath='{.spec.loadBalancerAnnotations.service\.beta\.kubernetes\.io/azure-dns-label-name}')
          LOCATION=$(az aks show --resource-group rg-aks-online-demo --name aks-online-demo --query location -o tsv)
          FQDN="$LABEL.$LOCATION.cloudapp.azure.com"

          # The address comes from the controller's own LoadBalancer Service
          # (the one carrying the DNS label). The Ingress status is not used:
          # after an ingress class switch it can keep the previous
          # controller's IP. Wait until the FQDN resolves to that address.
          ADDRESS=""; RESOLVED=""
          for i in $(seq 1 40); do
            ADDRESS=$(kubectl get svc -n app-routing-system -o jsonpath='{range .items[*]}{.metadata.annotations.service\.beta\.kubernetes\.io/azure-dns-label-name}{" "}{.status.loadBalancer.ingress[0].ip}{"\n"}{end}' | awk -v l="$LABEL" '$1==l {print $2}')
            RESOLVED=$(getent hosts "$FQDN" | awk '{print $1}' | head -n1)
            [ -n "$ADDRESS" ] && [ "$ADDRESS" = "$RESOLVED" ] && break
            echo "Waiting for ingress address and DNS ($i/40): ingress=$ADDRESS dns=$RESOLVED"; sleep 15
          done
          [ -n "$ADDRESS" ] || { echo "::error::Ingress has no public address"; exit 1; }

          # A new load balancer rule can take a minute to answer; retry with
          # bounded timeouts. The runner's NSG allows outbound 443 only, so
          # the HTTP redirect is proven by the live Ingress configuration
          # (force-ssl-redirect); the http:// code is reported for reference.
          HTTPS_CODE=""
          for i in $(seq 1 30); do
            HTTPS_CODE=$(curl -sk -o body.html -w '%{http_code}' --max-time 10 "https://$FQDN/" || true)
            [ "$HTTPS_CODE" = "200" ] && break
            echo "Waiting for HTTPS 200 ($i/30), got $HTTPS_CODE"; sleep 10
          done
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://$ADDRESS/" || true)
          REDIRECT=$(kubectl get ingress online-demo -n online-demo -o jsonpath='{.metadata.annotations.nginx\.ingress\.kubernetes\.io/force-ssl-redirect}')
          TLS=$(kubectl get ingress online-demo -n online-demo -o jsonpath='{.spec.tls}')
          EGRESS=$(terraform output -raw nat_gateway_public_ip 2>/dev/null || echo "n/a")

          {
            echo "### Online demo app"
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| App URL | \`https://$FQDN/\` |"
            echo "| DNS resolves to ingress IP | \`$RESOLVED\` = \`$ADDRESS\` |"
            echo "| \`https://\` response (by hostname) | $HTTPS_CODE (expect 200) |"
            echo "| Page title | $(grep -o '<title>[^<]*' body.html | sed 's/<title>//') |"
            echo "| Ingress \`force-ssl-redirect\` | $REDIRECT (expect true) |"
            echo "| Ingress TLS configured | $([ -n "$TLS" ] && echo yes || echo no) (NGINX default self-signed certificate) |"
            echo "| \`http://\` from runner | $HTTP_CODE (runner egress is 443-only; 000 expected) |"
            echo "| Cluster egress (NAT Gateway) | \`$EGRESS\` |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          [ "$ADDRESS" = "$RESOLVED" ] || { echo "::error::$FQDN does not resolve to the ingress address"; exit 1; }
          [ "$HTTPS_CODE" = "200" ] || { echo "::error::HTTPS did not return 200"; exit 1; }
          grep -q '<title>AKS Automatic | NIC 2026 demo' body.html || { echo "::error::Unexpected page content"; exit 1; }
          grep -q 'Served by pod <b>online-demo-' body.html || { echo "::error::Page not rendered by an online-demo pod"; exit 1; }
          [ "$REDIRECT" = "true" ] || { echo "::error::Ingress does not force HTTPS"; exit 1; }
          [ -n "$TLS" ] || { echo "::error::Ingress has no TLS section"; exit 1; }

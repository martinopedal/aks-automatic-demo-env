name: "Deploy Demo VM"

# Legacy clean-machine dispatch remains separate. Main merges/upgrade dispatches queue a fresh
# private saved plan, Haflidi's exact-plan gate, then the existing online gate.
# No GitHub plan/state artifacts, new identities or new trust configuration.
#
# The local admin password is generated here, masked, passed as an
# ephemeral variable, and sent once through azapi sensitive_body: it is
# never written to the plan file, state, or logs. Members sign in with
# Microsoft Entra ID instead.
#
# Before dispatching, start one runner execution:
#   scripts/start-online-runner.ps1 -Repo martinopedal/aks-automatic-demo-env

on:
  pull_request:
    branches: [main]
    paths: ['deployments/demo-vm/**', '.github/workflows/deploy-demo-vm.yml']
  push:
    branches: [main]
    paths: ['deployments/demo-vm/**', '.github/workflows/deploy-demo-vm.yml']
  workflow_dispatch:
    inputs:
      action:
        description: "qualify-transport (isolated probe) | upgrade (protected main delivery) | plan | apply | recreate-vm (reset to a clean machine) | destroy"
        required: true
        default: plan
        type: choice
        options: [plan, upgrade, qualify-transport, apply, recreate-vm, destroy]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'qualify-transport' && 'demo-vm-transport-qualification' || 'deploy-demo-vm' }}
  cancel-in-progress: false

env:
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_ONLINE }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID_ONLINE }}
  TF_VAR_entra_admin_object_ids: ${{ vars.DEMO_VM_ENTRA_ADMINS || '[]' }}
  TF_VAR_bastion_user_object_ids: ${{ vars.DEMO_VM_BASTION_USERS || '[]' }}

jobs:
  offline:
    name: Demo VM offline contracts
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARM_USE_OIDC: false
      ARM_CLIENT_ID: ""
      ARM_TENANT_ID: ""
      ARM_SUBSCRIPTION_ID: ""
      TF_VAR_entra_admin_object_ids: "[]"
      TF_VAR_bastion_user_object_ids: "[]"
    defaults:
      run:
        working-directory: deployments/demo-vm
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate
      - run: terraform test -filter=tests/upgrade.tftest.hcl
      - run: python3 -m pip install --disable-pip-version-check -q -r tests/requirements.txt
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337
        with:
          tflint_version: v0.64.0
      - run: tflint --format compact
      - name: Qualification status (not an Azure plan)
        run: |
          echo '### Offline source only — no live plan or execution approval' >> "$GITHUB_STEP_SUMMARY"
          echo 'Total-tenant headroom, exact disk/downtime, SYSTEM payload and protected approval must qualify post-merge.' >> "$GITHUB_STEP_SUMMARY"

  offline-windows:
    name: Windows cmd and PowerShell 5.1 contracts
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      ARM_USE_OIDC: false
      ARM_CLIENT_ID: ""
      ARM_TENANT_ID: ""
      ARM_SUBSCRIPTION_ID: ""
      TF_VAR_entra_admin_object_ids: "[]"
      TF_VAR_bastion_user_object_ids: "[]"
    defaults:
      run:
        working-directory: deployments/demo-vm
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: python -m pip install --disable-pip-version-check -q -r tests/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'

  transport-qualification:
    name: Qualify existing private plan transport only
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.action == 'qualify-transport'
    runs-on: [self-hosted, aks-online-demo]
    timeout-minutes: 10
    environment: online
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: deployments/demo-vm
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Verify unchanged independent protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_environment.py
      - name: Existing online OIDC only
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_ONLINE }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID_ONLINE }}
      - name: Isolated synthetic create-read-conditional-delete proof
        env:
          BACKEND_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT_ONLINE }}
          BACKEND_CONTAINER: ${{ vars.TFSTATE_CONTAINER_NAME_ONLINE }}
          TRANSPORT_ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          AZ_PYTHON="$(az --version | python3 -c 'import re, sys; m = re.search(r"Python location [\x27]([^\x27]+)[\x27]", sys.stdin.read()); assert m, "Existing Azure CLI Python unavailable"; print(m.group(1))')"
          test -x "$AZ_PYTHON"
          "$AZ_PYTHON" -IB scripts/delivery_guard.py transport

  upgrade-policy:
    name: Verify actual Haflidi gate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'upgrade'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Fail closed if dedicated protection is absent or permissive
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 deployments/demo-vm/scripts/check_environment.py

  upgrade-plan:
    name: Fresh existing-VM saved plan
    needs: upgrade-policy
    runs-on: [self-hosted, aks-online-demo]
    timeout-minutes: 45
    environment: online
    permissions:
      contents: read
      id-token: write
    outputs:
      bundle_sha256: ${{ steps.seal.outputs.bundle_sha256 }}
      plan_sha256: ${{ steps.seal.outputs.plan_sha256 }}
    defaults:
      run:
        working-directory: deployments/demo-vm
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - name: Private scope and owner qualification
        env:
          BINDING: ${{ secrets.DEMO_VM_UPGRADE_BINDING_JSON }}
          QUALIFICATION: ${{ secrets.DEMO_VM_UPGRADE_QUALIFICATION_JSON }}
          COST_RECEIPT: ${{ secrets.DEMO_VM_UPGRADE_COST_RECEIPT_JSON }}
          PRIVATE_TRANSPORT_ACCEPTED: ${{ vars.DEMO_VM_PRIVATE_PLAN_TRANSPORT_ACCEPTED }}
        run: |
          umask 077
          [ "$PRIVATE_TRANSPORT_ACCEPTED" = true ] || { echo "::error::Existing private backend plan-prefix transport not qualified; no new IAM or keys"; exit 1; }
          python3 scripts/delivery_guard.py prepare
      - name: Validate private inputs without publishing diagnostics
        run: |
          umask 077
          { terraform fmt -check -recursive &&
            terraform init -backend=false -input=false -lockfile=readonly &&
            terraform validate; } > validation.log 2>&1 || { echo "::error::Private Terraform validation blocked; inspect private runner evidence"; exit 1; }
      - run: python3 -m pip install --disable-pip-version-check -q -r tests/requirements.txt
      - name: Offline contracts with private configuration present
        run: |
          umask 077
          { terraform test -filter=tests/upgrade.tftest.hcl &&
            python3 -m unittest discover -s tests -p 'test_*.py'; } > contracts.log 2>&1 || { echo "::error::Private configuration contracts blocked; inspect private runner evidence"; exit 1; }
      - name: Azure Login (unchanged online OIDC trust)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_ONLINE }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID_ONLINE }}
      - name: Existing isolated backend
        run: |
          terraform init -reconfigure -input=false -lockfile=readonly \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP_ONLINE }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT_ONLINE }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER_NAME_ONLINE }}" \
            -backend-config="key=demo-vm.tfstate" \
            -backend-config="subscription_id=$ARM_SUBSCRIPTION_ID" \
            -backend-config="tenant_id=$ARM_TENANT_ID" \
            -backend-config="client_id=$ARM_CLIENT_ID" \
            -backend-config="use_oidc=true" -backend-config="use_azuread_auth=true"
      - name: Read-only target baseline and exact incremental plan
        run: |
          python3 scripts/delivery_guard.py snapshot
          set +e
          terraform plan -input=false -out=tfplan -detailed-exitcode > plan.log 2>&1
          ec=$?
          set -e
          [ "$ec" -eq 2 ] || { echo "::error::Initial upgrade requires a change plan (0=no changes, 1=error); inspect private runner evidence"; exit 1; }
          terraform show -json tfplan > tfplan.json
          python3 scripts/delivery_guard.py plan
          python3 scripts/delivery_guard.py seal
      - name: Seal into existing PRIVATE backend (never GitHub artifacts)
        id: seal
        run: |
          ACCESS=$(az storage container show --auth-mode login --only-show-errors \
            --account-name "${{ vars.TFSTATE_STORAGE_ACCOUNT_ONLINE }}" \
            --name "${{ vars.TFSTATE_CONTAINER_NAME_ONLINE }}" --query properties.publicAccess -o tsv)
          [ -z "$ACCESS" ] || { echo "::error::Plan container allows anonymous access; transport blocked"; exit 1; }
          tar -cf delivery.tar tfplan baseline.json upgrade.auto.tfvars.json qualification.json cost-receipt.json seal.json
          az storage blob upload --auth-mode login --only-show-errors --output none \
            --account-name "${{ vars.TFSTATE_STORAGE_ACCOUNT_ONLINE }}" \
            --container-name "${{ vars.TFSTATE_CONTAINER_NAME_ONLINE }}" \
            --name "demo-vm-plans/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$GITHUB_SHA/delivery.tar" \
            --file delivery.tar --overwrite false
          echo "bundle_sha256=$(sha256sum delivery.tar | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "plan_sha256=$(sha256sum tfplan | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          {
            echo '### Exact saved plan awaits Haflidi and existing online approval'
            echo "Reviewed source: $GITHUB_SHA; run: $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
            echo "Saved plan SHA256: $(sha256sum tfplan | cut -d' ' -f1)"
            python3 scripts/delivery_guard.py summary
            echo 'Temporary authorization ends October 15 21:59:59Z, total-tenant cap USD2500. Bound inventory/actual queries, full VM and lag reserves must qualify that horizon; historical ~USD4005 EOM remains a separate risk warning.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove private local delivery material
        if: always()
        run: rm -f tfplan tfplan.json plan.log validation.log contracts.log delivery.tar baseline.json upgrade.auto.tfvars.json qualification.json cost-receipt.json seal.json

  upgrade-approval:
    name: Haflidi approves exact saved plan
    needs: upgrade-plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: demo-vm-upgrade-haflidi
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Recheck actual protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 deployments/demo-vm/scripts/check_environment.py
      - name: Approved plan binding (no OIDC in this job)
        env:
          PLAN_SHA: ${{ needs.upgrade-plan.outputs.plan_sha256 }}
        run: |
          [ "${#PLAN_SHA}" -eq 64 ] || exit 1
          echo "Haflidi gate released same-run saved plan SHA256 $PLAN_SHA" >> "$GITHUB_STEP_SUMMARY"

  upgrade-apply:
    name: Apply Haflidi-approved exact saved plan
    needs: [upgrade-plan, upgrade-approval]
    runs-on: [self-hosted, aks-online-demo]
    timeout-minutes: 120
    environment: online
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: deployments/demo-vm
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_ONLINE }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID_ONLINE }}
      - name: Retrieve exact bundle from existing PRIVATE backend
        env:
          BUNDLE_SHA: ${{ needs.upgrade-plan.outputs.bundle_sha256 }}
          PLAN_SHA: ${{ needs.upgrade-plan.outputs.plan_sha256 }}
        run: |
          umask 077
          az storage blob download --auth-mode login --only-show-errors --output none \
            --account-name "${{ vars.TFSTATE_STORAGE_ACCOUNT_ONLINE }}" \
            --container-name "${{ vars.TFSTATE_CONTAINER_NAME_ONLINE }}" \
            --name "demo-vm-plans/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$GITHUB_SHA/delivery.tar" \
            --file delivery.tar
          [ "$(sha256sum delivery.tar | cut -d' ' -f1)" = "$BUNDLE_SHA" ] || exit 1
          tar -xf delivery.tar tfplan baseline.json upgrade.auto.tfvars.json qualification.json cost-receipt.json seal.json
          [ "$(sha256sum tfplan | cut -d' ' -f1)" = "$PLAN_SHA" ] || exit 1
      - name: Existing backend; no replacement or fresh apply plan
        run: |
          umask 077
          terraform init -input=false -lockfile=readonly \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP_ONLINE }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT_ONLINE }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER_NAME_ONLINE }}" \
            -backend-config="key=demo-vm.tfstate" \
            -backend-config="subscription_id=$ARM_SUBSCRIPTION_ID" \
            -backend-config="tenant_id=$ARM_TENANT_ID" \
            -backend-config="client_id=$ARM_CLIENT_ID" \
            -backend-config="use_oidc=true" -backend-config="use_azuread_auth=true" \
            > validation.log 2>&1 || { echo "::error::Private backend initialization blocked; inspect private runner evidence"; exit 1; }
          terraform validate >> validation.log 2>&1 || { echo "::error::Private Terraform validation blocked; inspect private runner evidence"; exit 1; }
          python3 scripts/delivery_guard.py verify
          terraform show -json tfplan > tfplan.json
          python3 scripts/delivery_guard.py plan
      - name: Apply ONLY that exact saved plan
        run: |
          # Required failures stay nonzero; never expose raw Terraform output
          # from this public workflow. The authenticated private runner owns it.
          terraform apply -input=false tfplan > apply.log 2>&1
      - name: Remove private delivery material
        if: always()
        run: |
          rm -f tfplan tfplan.json apply.log validation.log delivery.tar baseline.json upgrade.auto.tfvars.json qualification.json cost-receipt.json seal.json
          az storage blob delete --auth-mode login --only-show-errors --output none \
            --account-name "${{ vars.TFSTATE_STORAGE_ACCOUNT_ONLINE }}" \
            --container-name "${{ vars.TFSTATE_CONTAINER_NAME_ONLINE }}" \
            --name "demo-vm-plans/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$GITHUB_SHA/delivery.tar"

  deploy:
    name: Demo VM ${{ inputs.action }}
    runs-on: [self-hosted, aks-online-demo]
    if: github.event_name == 'workflow_dispatch' && inputs.action != 'upgrade' && inputs.action != 'qualify-transport'
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 75
    environment: online
    defaults:
      run:
        working-directory: deployments/demo-vm
    steps:
      - name: Block legacy writes in the preservation revision
        if: inputs.action != 'plan'
        run: |
          echo "::error::This preservation revision requires the exact upgrade delivery path. Legacy apply/reset/destroy needs a separate reviewed source revision; the current restored disk is protected."
          exit 1
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          # Write-only arguments need >= 1.11.
          terraform_version: "~1.14"
          terraform_wrapper: false

      - name: Install Azure CLI
        run: |
          if ! command -v az &> /dev/null; then
            curl -sL https://aka.ms/InstallAzureCLIDeb | bash
          fi
          az version

      - name: Azure Login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43  # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_ONLINE }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID_ONLINE }}

      - name: Generate ephemeral admin password (masked, never stored)
        run: |
          PASS="$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 24)Aa1!"
          echo "::add-mask::$PASS"
          echo "TF_VAR_admin_password=$PASS" >> "$GITHUB_ENV"

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP_ONLINE }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT_ONLINE }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER_NAME_ONLINE }}" \
            -backend-config="key=demo-vm.tfstate" \
            -backend-config="subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID_ONLINE }}" \
            -backend-config="tenant_id=${{ vars.AZURE_TENANT_ID }}" \
            -backend-config="client_id=${{ secrets.AZURE_CLIENT_ID_ONLINE }}" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform Plan
        id: plan
        run: |
          set +e
          ARGS=()
          case "${{ inputs.action }}" in
            destroy) ARGS=(-destroy) ;;
            recreate-vm)
              # Replace the VM and everything Azure deletes with it (extension,
              # auto-shutdown schedule, VM-scoped role assignments), so state
              # and Azure never diverge. The NIC is detached and kept.
              mapfile -t REPL < <(terraform state list | grep -E '^azapi_resource\.(vm|aad_login|auto_shutdown|install_pwsh|ra_vm_admin_login)(\[|$)')
              [ "${#REPL[@]}" -gt 0 ] || { echo "::error::No VM in state to recreate; run apply first"; exit 1; }
              for r in "${REPL[@]}"; do ARGS+=("-replace=$r"); done
              printf 'Replacing: %s\n' "${REPL[@]}" ;;
          esac
          terraform plan -input=false -out=tfplan -detailed-exitcode "${ARGS[@]}" > legacy-plan.log 2>&1
          ec=$?
          echo "exitcode=$ec" >> "$GITHUB_OUTPUT"
          [ "$ec" -eq 1 ] && exit 1 || exit 0

      - name: Plan summary
        if: steps.plan.outputs.exitcode == '2'
        run: |
          {
            echo "### Demo VM plan (${{ inputs.action }})"
            echo 'Legacy comparison plan created privately; raw Terraform values are not published.'
            echo 'No legacy writes permitted in this preservation revision. Use the exact upgrade lane.'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Terraform Apply
        if: inputs.action != 'plan' && steps.plan.outputs.exitcode == '2'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Remove local plan file
        if: always()
        run: rm -f tfplan legacy-plan.log

      - name: Prove the VM is reachable only through Bastion
        if: inputs.action == 'apply' || inputs.action == 'recreate-vm'
        run: |
          set -e
          RG=rg-demo-vm-online
          VM=vm-demo-copilot
          # Landing-zone policies keep updating the VM (agents, platform
          # identity) for several minutes after creation, which holds the
          # VM and our extension in "Updating". Wait for a terminal state
          # (bounded) instead of asserting a moving target.
          for i in $(seq 1 40); do
            VMSTATE=$(az vm get-instance-view -g $RG -n $VM --query "instanceView.statuses[?starts_with(code,'ProvisioningState/')].code | [0]" -o tsv)
            AAD=$(az vm extension show -g $RG --vm-name $VM -n AADLoginForWindows --query provisioningState -o tsv)
            [ "$VMSTATE" = "ProvisioningState/succeeded" ] && [ "$AAD" = "Succeeded" ] && break
            [ "$AAD" = "Failed" ] && break
            echo "Waiting for VM and extension to settle ($i/40): vm=$VMSTATE aad=$AAD"; sleep 30
          done
          POWER=$(az vm get-instance-view -g $RG -n $VM --query "instanceView.statuses[?starts_with(code,'PowerState/')].displayStatus | [0]" -o tsv)
          TL=$(az vm show -g $RG -n $VM --query "securityProfile.securityType" -o tsv)
          SB=$(az vm show -g $RG -n $VM --query "securityProfile.uefiSettings.secureBootEnabled" -o tsv)
          PIP=$(az network nic show -g $RG -n nic-demo-copilot --query "ipConfigurations[0].publicIPAddress.id" -o tsv)
          OPEN=$(az network nsg rule list -g $RG --nsg-name nsg-demo-copilot-vm --query "[?direction=='Inbound' && access=='Allow' && (sourceAddressPrefix=='*' || sourceAddressPrefix=='Internet')] | length(@)" -o tsv)
          # az resource show needs no CLI extension (az network bastion does).
          BAS=$(az resource show -g $RG -n bas-demo-copilot --resource-type Microsoft.Network/bastionHosts --query "join(' ', [properties.provisioningState, to_string(properties.enableTunneling), sku.name])" -o tsv)
          EXTS=$(az vm extension list -g $RG --vm-name $VM --query "join(', ', [].name)" -o tsv)
          PWSH_STATE=$(az vm run-command show -g $RG --vm-name $VM --run-command-name install-pwsh7 --instance-view --query "instanceView.executionState" -o tsv)
          PWSH_OUT=$(az vm run-command show -g $RG --vm-name $VM --run-command-name install-pwsh7 --instance-view --query "instanceView.output" -o tsv | grep -o 'pwsh version: [0-9.]*' || true)
          {
            echo "### Demo VM"
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Power / provisioning | $POWER / ${VMSTATE#ProvisioningState/} |"
            echo "| Entra ID login extension | $AAD |"
            echo "| Trusted Launch / Secure Boot | $TL / $SB |"
            echo "| Public IP on VM NIC | ${PIP:-none} |"
            echo "| NSG inbound allows from Internet/* | $OPEN |"
            echo "| Bastion (state, tunneling, SKU) | $BAS |"
            echo "| VM extensions (incl. landing-zone policy) | $EXTS |"
            echo "| PowerShell 7 prerequisite | $PWSH_STATE / ${PWSH_OUT:-no output} |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$POWER" = "VM running" ] || { echo "::error::VM is not running"; exit 1; }
          [ "$AAD" = "Succeeded" ] || { echo "::error::Entra login extension not ready: $AAD"; exit 1; }
          [ "$TL" = "TrustedLaunch" ] && [ "$SB" = "true" ] || { echo "::error::Trusted Launch not enabled"; exit 1; }
          [ -z "$PIP" ] || { echo "::error::VM NIC has a public IP"; exit 1; }
          [ "$OPEN" = "0" ] || { echo "::error::VM NSG allows inbound from the internet"; exit 1; }
          [ "$BAS" = "Succeeded true Standard" ] || { echo "::error::Bastion not ready or tunneling disabled: $BAS"; exit 1; }
          [ "$PWSH_STATE" = "Succeeded" ] && [ "$PWSH_OUT" = "pwsh version: 7.6.6" ] || { echo "::error::PowerShell 7.6.6 prerequisite not installed: $PWSH_STATE $PWSH_OUT"; exit 1; }

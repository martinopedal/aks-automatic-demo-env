# Standard networking.k8s.io/v1 Ingress consumed by the AKS managed NGINX
# "Application Routing" add-on (enable_managed_nginx = true), through the
# dedicated controller in ingress-controller.yaml. That controller's public
# Standard Load Balancer frontend carries the Azure DNS label, so the app is
# reachable at https://aks-online-demo.swedencentral.cloudapp.azure.com/.
# No host rule: the bare IP keeps working too. No AGC/ALB controller or
# delegated subnet is required.
#
# HTTPS only: force-ssl-redirect sends HTTP to HTTPS. With no TLS secret,
# NGINX serves its default self-signed certificate (use `curl -k`). For
# production, store the certificate in Key Vault: the module can grant the
# add-on identity "Key Vault Certificate User" (create_keyvault = true).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: online-demo
  namespace: online-demo
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: online-demo
  tls:
    - {}
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: online-demo
                port:
                  number: 80

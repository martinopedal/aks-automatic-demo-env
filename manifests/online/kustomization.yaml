apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The namespace itself is an AKS managed namespace created by Terraform
# (deployments/online/namespace.tf), so it is not part of this kustomization.
resources:
  - ingress-controller.yaml
  - networkpolicy.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
# The page and NGINX config. The generated name carries a content hash, so
# editing either file rolls the Deployment.
configMapGenerator:
  - name: online-demo-site
    namespace: online-demo
    files:
      - site/index.html
      - site/default.conf
      - site/martin.jpg
      - site/haflidi.jpg

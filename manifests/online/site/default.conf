# Mounted over /etc/nginx/conf.d/default.conf. The unprivileged image keeps
# its pid and temp files in /tmp (an emptyDir), so the root filesystem stays
# read-only.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /martin.jpg {
        access_log off;
    }

    location / {
        sub_filter_once off;
        sub_filter '__POD__' '$hostname';
        sub_filter '__TIME__' '$time_iso8601';
        try_files $uri /index.html;
    }
}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-demo
  namespace: online-demo
  labels:
    app: online-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: online-demo
  template:
    metadata:
      labels:
        app: online-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # UID/GID above 10000 so they never collide with host system accounts
        # (Trivy KSV-0020/KSV-0021). The app needs no writable home: the root
        # filesystem is read-only and /tmp is an emptyDir.
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: online-demo
      containers:
        - name: web
          # Official NGINX unprivileged image (Alpine): listens on 8080 and
          # supports an arbitrary non-root UID (10001 set above), so no
          # privileged port or capability is needed. The page and server
          # config come from the site ConfigMap (kustomization.yaml).
          # Pinned by digest for a reproducible deploy. The entrypoint
          # scripts are skipped: they try to edit config on a read-only fs.
          image: docker.io/nginxinc/nginx-unprivileged:1.29-alpine@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
          command: ["nginx", "-g", "daemon off;"]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: site
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
            - name: site
              mountPath: /usr/share/nginx/html/martin.jpg
              subPath: martin.jpg
              readOnly: true
            - name: site
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: site
          configMap:
            name: online-demo-site
